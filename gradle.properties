android.useAndroidX=true
android.newDsl=false
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g

# Kotlin incremental-cache corruption on Windows.
# Symptom: "Storage for [...lookups.tab] is already registered" followed by
# "Failed to create MD5 hash for file: ...\caches-jvm\**\*.tab.keystream".
# Cause:   the Kotlin compiler's memory-mapped FilePageCache registers the same
#          cache file twice across separate Kotlin daemon sessions.
# Fix:     compile inside the Gradle daemon and skip the on-disk .tab caches.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false


# Flow Neuroengine
FLOW_NEURO_BASE_URL=https://api.flowneuroengine.com
FLOW_NEURO_API_KEY=dummy_key
android.useFullClasspathForDexingTransform=true
android.suppressUnsupportedCompileSdk=37
